<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZERO PRO — Autonomous Digital Suite</title>
  <meta name="description" content="Curated ultra-modern client-side utilities with interactive live animations and zero cloud latency.">
  <meta name="theme-color" content="#030509">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Client Processing Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-base: #030509;
      --bg-surface: rgba(11, 15, 26, 0.75);
      --bg-card: rgba(15, 21, 37, 0.55);
      --bg-input: rgba(7, 10, 19, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(99, 102, 241, 0.45);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #06b6d4 100%);
      --glow-accent: rgba(99, 102, 241, 0.25);
      --text-main: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --status-success: #10b981;
      --status-warning: #f59e0b;
      --status-danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      letter-spacing: -0.015em;
      position: relative;
    }

    /* Hardware Animated Background Canvas */
    #live-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Ambient Aurora Orbs */
    .aurora-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }
    .orb-1 {
      top: -10%;
      left: 20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, transparent 70%);
    }
    .orb-2 {
      bottom: 10%;
      right: 15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, transparent 70%);
      animation-duration: 16s;
    }
    @keyframes floatOrb {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(50px) scale(1.08); }
    }

    /* Glass Header */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(3, 5, 9, 0.7);
      border-bottom: 1px solid var(--border-subtle);
    }
    .nav-inner {
      max-width: 1320px;
      height: 72px;
      margin: 0 auto;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.25rem;
      cursor: pointer;
    }
    .brand-symbol {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      box-shadow: 0 0 20px var(--glow-accent);
      transition: transform 0.4s var(--spring);
    }
    .brand-wrap:hover .brand-symbol {
      transform: rotate(180deg) scale(1.08);
    }

    .search-trigger {
      flex: 1;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 0.65rem 1.25rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.875rem;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.3s var(--spring);
    }
    .search-trigger:hover {
      border-color: var(--border-highlight);
      background: rgba(18, 25, 43, 0.9);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
      transform: translateY(-1px);
    }
    .search-trigger kbd {
      margin-left: auto;
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    /* Main Container */
    #app-root {
      flex: 1;
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
      position: relative;
      z-index: 1;
    }

    .view-hidden { display: none !important; }
    .view-active {
      display: block;
      animation: viewSlideIn 0.4s var(--spring);
    }
    @keyframes viewSlideIn {
      from { opacity: 0; transform: translateY(16px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 3rem 1rem 3.5rem;
      max-width: 860px;
      margin: 0 auto;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.45rem 1.1rem;
      border-radius: var(--radius-full);
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      font-size: 0.8rem;
      font-weight: 600;
      color: #c7d2fe;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.2);
    }
    .live-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
      animation: pulseGreen 2s infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }
    .hero-title {
      font-size: clamp(2.6rem, 5.5vw, 4.2rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.04em;
      margin-bottom: 1.25rem;
    }
    .gradient-text {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(99, 102, 241, 0.35);
    }
    .hero-subtitle {
      font-size: 1.18rem;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    /* 10 Power Tools Spotlight Grid */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.5rem;
    }
    .tool-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.35s var(--spring), border-color 0.35s var(--spring), box-shadow 0.35s var(--spring);
    }
    .tool-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(800px circle at var(--mouse-x, 0) var(--mouse-y, 0), rgba(99, 102, 241, 0.15), transparent 40%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .tool-card:hover::before { opacity: 1; }
    .tool-card:hover {
      transform: translateY(-6px) scale(1.015);
      border-color: var(--border-highlight);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(99, 102, 241, 0.2);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .card-icon-box {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c7d2fe;
      transition: all 0.3s var(--spring);
    }
    .tool-card:hover .card-icon-box {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 0 20px var(--glow-accent);
      transform: scale(1.1) rotate(4deg);
    }
    .card-tag {
      font-size: 0.725rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }
    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }
    .card-desc {
      font-size: 0.925rem;
      color: var(--text-secondary);
      line-height: 1.6;
      flex: 1;
    }
    .card-launch-row {
      margin-top: 1.5rem;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      transition: transform 0.25s ease;
    }
    .tool-card:hover .card-launch-row {
      transform: translateX(4px);
      color: #a5b4fc;
    }

    /* Tool Viewport Layout */
    .viewport-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 0.65rem 1.35rem;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s var(--spring);
    }
    .back-btn:hover {
      border-color: var(--border-highlight);
      transform: translateX(-3px);
      background: rgba(255, 255, 255, 0.06);
    }

    .tool-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Laser Scanning Dropzone */
    .dropzone-laser {
      position: relative;
      border: 2px dashed rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      padding: 3.5rem 2rem;
      text-align: center;
      background: rgba(10, 14, 25, 0.5);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s var(--spring);
      margin-bottom: 1.5rem;
    }
    .dropzone-laser:hover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.08);
      transform: scale(0.995);
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.15);
    }
    .dropzone-laser.scanning::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent-cyan);
      box-shadow: 0 0 20px 4px var(--accent-cyan);
      animation: scanLaser 1.8s ease-in-out infinite alternate;
    }
    @keyframes scanLaser {
      0% { top: 0%; opacity: 0.8; }
      100% { top: 100%; opacity: 1; }
    }

    /* Buttons & Inputs */
    .action-btn {
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-full);
      padding: 0.85rem 1.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px var(--glow-accent);
      transition: all 0.3s var(--spring);
    }
    .action-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
    }
    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .action-btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 0.85rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s var(--spring);
    }
    .action-btn-secondary:hover {
      border-color: var(--border-highlight);
      background: rgba(255, 255, 255, 0.1);
    }

    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 0.85rem 1.15rem;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s var(--spring);
    }
    input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    /* Modal / Command Palette */
    .cmd-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(16px);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 14vh;
    }
    .cmd-card {
      width: 100%;
      max-width: 620px;
      background: #090d19;
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-lg);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(99, 102, 241, 0.2);
      overflow: hidden;
      animation: cmdIn 0.25s var(--spring);
    }
    @keyframes cmdIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .cmd-search-input {
      width: 100%;
      padding: 1.25rem 1.5rem;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 1.15rem;
      outline: none;
    }

    /* Toast */
    .toast-tray {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .toast-card {
      background: rgba(11, 15, 26, 0.95);
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-md);
      padding: 0.9rem 1.5rem;
      color: var(--text-main);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      font-size: 0.925rem;
      backdrop-filter: blur(12px);
      animation: toastRise 0.3s var(--spring);
    }
    @keyframes toastRise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Hardware Canvas Particles -->
  <canvas id="live-canvas"></canvas>
  <div class="aurora-orb orb-1"></div>
  <div class="aurora-orb orb-2"></div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-inner">
      <div class="brand-wrap" id="brand-home">
        <div class="brand-symbol">Ø</div>
        <span>ZERO PRO</span>
      </div>

      <button class="search-trigger" id="cmd-k-trigger">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span>Search curated utilities...</span>
        <kbd>⌘K</kbd>
      </button>

      <div style="font-family:var(--font-mono); font-size:0.8rem; color:var(--text-muted); display:flex; align-items:center; gap:6px;">
        <span class="live-pulse"></span>
        <span>100% IN-RAM</span>
      </div>
    </div>
  </header>

  <!-- APP VIEWPORT -->
  <main id="app-root">
    <!-- HUB VIEW -->
    <section id="view-hub" class="view-active">
      <div class="hero">
        <div class="live-badge">
          <span class="live-pulse"></span>
          <span>Zero Server Uploads • Zero Telemetry • 10X Hardware Acceleration</span>
        </div>
        <h1 class="hero-title">Ultra-Fast Digital Tools.<br><span class="gradient-text">Radical 10X Architecture.</span></h1>
        <p class="hero-subtitle">
          10 Essential Powerhouse utilities running entirely on local WebAssembly, Web Crypto, and GPU Offscreen Canvas.
        </p>
      </div>

      <!-- Curated 10 Power Tools Spotlight Grid -->
      <div class="tool-grid" id="tools-directory"></div>
    </section>

    <!-- MOUNTED TOOL VIEW -->
    <section id="view-tool" class="view-hidden">
      <div class="viewport-header">
        <button id="btn-back-hub" class="back-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>Back to Tools</span>
        </button>
        <div style="text-align:center;">
          <h2 id="tool-active-title" style="font-size:1.6rem; font-weight:800;">Tool Name</h2>
          <span id="tool-active-cat" style="font-size:0.75rem; color:var(--accent); text-transform:uppercase; font-weight:700; letter-spacing:0.05em;">Curated Suite</span>
        </div>
        <div style="width:120px;"></div>
      </div>
      <div id="tool-mount-point"></div>
    </section>
  </main>

  <!-- COMMAND PALETTE (CMD+K) -->
  <div class="cmd-backdrop" id="cmd-palette" style="display:none;">
    <div class="cmd-card">
      <input type="text" class="cmd-search-input" id="palette-input" placeholder="Type a tool name (e.g. PDF, background, ATS, JSON)..." autocomplete="off">
      <div id="palette-results" style="max-height:360px; overflow-y:auto; padding:0.75rem;"></div>
    </div>
  </div>

  <div id="toast-tray" class="toast-tray"></div>

  <script>
    /* =====================================================================
       ZERO INTERACTIVE LIVE CANVAS & CORE ENGINE
       ===================================================================== */
    const ZERO = {
      activeToolId: null,

      toast(msg, type = 'info') {
        const tray = document.getElementById('toast-tray');
        const card = document.createElement('div');
        card.className = 'toast-card';
        card.style.borderColor = type === 'error' ? 'var(--status-danger)' : (type === 'success' ? 'var(--status-success)' : 'var(--border-highlight)');
        card.textContent = msg;
        tray.appendChild(card);
        setTimeout(() => card.remove(), 3200);
      },

      downloadBlob(data, filename, mimeType) {
        let blob = data instanceof Blob ? data : new Blob([data], { type: mimeType || 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2500);
      },

      setupDropzone(dropEl, inputEl, onFiles) {
        dropEl.onclick = () => inputEl.click();
        dropEl.ondragover = (e) => { e.preventDefault(); dropEl.classList.add('scanning'); };
        dropEl.ondragleave = () => dropEl.classList.remove('scanning');
        dropEl.ondrop = (e) => {
          e.preventDefault();
          dropEl.classList.remove('scanning');
          if (e.dataTransfer.files?.length) onFiles(Array.from(e.dataTransfer.files));
        };
        inputEl.onchange = () => {
          if (inputEl.files?.length) {
            onFiles(Array.from(inputEl.files));
            inputEl.value = '';
          }
        };
      }
    };

    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // Dynamic Background Particle Canvas
    (function initBackgroundCanvas() {
      const canvas = document.getElementById('live-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, pts = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 40; i++) {
        pts.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 2 + 1
        });
      }

      function loop() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(99, 102, 241, 0.35)';
        ctx.strokeStyle = 'rgba(99, 102, 241, 0.08)';

        for (let i = 0; i < pts.length; i++) {
          let p = pts[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();

          for (let j = i + 1; j < pts.length; j++) {
            let p2 = pts[j];
            let d = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (d < 140) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    })();

          </div>
        </div>
      `;
      const drop = mount.querySelector('#bg-drop'), input = mount.querySelector('#bg-input');
      const canvas = mount.querySelector('#bg-canvas'), sens = mount.querySelector('#bg-sens');

        drop.classList.add('scanning');
        orig = new Image();
        orig.src = URL.createObjectURL(f[0]);
        await orig.decode();
        canvas.width = orig.naturalWidth;
        canvas.height = orig.naturalHeight;
        runMatting();
        drop.classList.remove('scanning');
        mount.querySelector('#bg-workbench').style.display = 'block';
      });

      mount.querySelector('#bg-re-eval').onclick = () => runMatting();
      sens.oninput = () => runMatting();

      function runMatting(customKey = null) {
        if (!orig) return;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(orig, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data, w = canvas.width, h = canvas.height;

        let bgR = customKey ? customKey[0] : (d[0] + d[(w-1)*4] + d[(h-1)*w*4] + d[(h*w-1)*4]) / 4;
        let bgG = customKey ? customKey[1] : (d[1] + d[(w-1)*4+1] + d[(h-1)*w*4+1] + d[(h*w-1)*4+1]) / 4;
        let bgB = customKey ? customKey[2] : (d[2] + d[(w-1)*4+2] + d[(h-1)*w*4+2] + d[(h*w-1)*4+2]) / 4;
        const tol = sens.value * 3.2;

        for (let i = 0; i < d.length; i += 4) {
          const diff = Math.abs(d[i] - bgR) + Math.abs(d[i+1] - bgG) + Math.abs(d[i+2] - bgB);
          if (diff < tol) d[i+3] = 0;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.round((e.clientX - rect.left) * (canvas.width / rect.width));
        const y = Math.round((e.clientY - rect.top) * (canvas.height / rect.height));
        const p = canvas.getContext('2d').getImageData(x, y, 1, 1).data;
        runMatting([p[0], p[1], p[2]]);
        ZERO.toast('Keyed color sampled from pixel point!', 'info');
      };

      mount.querySelector('#bg-dl').onclick = () => {
        ZERO.downloadBlob(canvas.toDataURL('image/png'), 'isolated_subject.png', 'image/png');
      };
    }

    const TOOLS = [
      { id: 'bg-remover', name: 'AI Subject Isolator', cat: 'Vision', desc: 'Hardware-accelerated chroma matting & background removal with eyedropper keying.', render: renderBgRemover, icon: '✦' },
      { id: 'pdf-merger', name: 'PDF Fusion Pro', cat: 'PDF Core', desc: 'Combine multiple PDF documents into a clean master file in device RAM.', render: renderPdfMerger, icon: '◫' },
      { id: 'pdf-splitter', name: 'Precision PDF Slicer', cat: 'PDF Core', desc: 'Extract pages, intervals, or ranges into an independent PDF instantly.', render: renderPdfSplitter, icon: '✂' },
      { id: 'img-compressor', name: 'Ultra Image Quantizer', cat: 'Vision', desc: 'Downsample and compress JPG/PNG images into modern WebP with live byte savings.', render: renderImageCompressor, icon: '⚡' },
      { id: 'resume-builder', name: 'ATS Resume Architect', cat: 'Docs', desc: 'Corporate resume editor with clean typography and print-to-PDF layout.', render: renderResumeBuilder, icon: '☰' },
      { id: 'json-formatter', name: 'JSON & Code Studio', cat: 'Dev', desc: 'High-speed JSON validation, beautification, minification, and copy.', render: renderJsonFormatter, icon: '{ }' },
      { id: 'crypto-vault', name: 'Cryptographic Hasher', cat: 'Security', desc: 'Compute parallel SHA-256 and SHA-512 digests via native Web Crypto.', render: renderCryptoVault, icon: '⚿' },
      { id: 'qr-gen', name: 'Vector QR Studio', cat: 'System', desc: 'Generate high-resolution downloadable QR codes for URLs and text.', render: renderQrGenerator, icon: '▣' },
      { id: 'img-to-pdf', name: 'Image Document Compiler', cat: 'PDF Core', desc: 'Compile PNG and JPEG pictures into an aligned master PDF.', render: renderImageToPdf, icon: '🗎' },
      { id: 'linguistic-editor', name: 'Linguistic Heuristics', cat: 'Docs', desc: 'Real-time offline syntax, typography, and tone analysis engine.', render: renderLinguisticEditor, icon: '✎' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      renderDirectory();
      initPalette();

      document.getElementById('brand-home').onclick = closeTool;
      document.getElementById('btn-back-hub').onclick = closeTool;
    });

    function renderDirectory() {
      const g = document.getElementById('tools-directory');
      g.innerHTML = '';
      TOOLS.forEach(t => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
          <div class="card-top">
            <div class="card-icon-box">${t.icon}</div>
            <span class="card-tag">${t.cat}</span>
          </div>
          <h3 class="card-title">${t.name}</h3>
          <p class="card-desc">${t.desc}</p>
          <div class="card-launch-row">
            <span>Launch Utility</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </div>
        `;
        // Interactive Spotlight Cursor Tracking
        card.onmousemove = (e) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
          card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
        };
        card.onclick = () => openTool(t.id);
        g.appendChild(card);
      });
    }

    function openTool(id) {
      const tool = TOOLS.find(t => t.id === id);
      if (!tool) return;
      ZERO.activeToolId = tool.id;
      document.getElementById('view-hub').classList.replace('view-active', 'view-hidden');
      document.getElementById('view-tool').classList.replace('view-hidden', 'view-active');
      document.getElementById('tool-active-title').innerText = tool.name;
      document.getElementById('tool-active-cat').innerText = tool.cat;
      const mount = document.getElementById('tool-mount-point');
      mount.innerHTML = '';
      tool.render(mount);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeTool() {
      document.getElementById('view-tool').classList.replace('view-active', 'view-hidden');
      document.getElementById('view-hub').classList.replace('view-hidden', 'view-active');
      ZERO.activeToolId = null;
    }

    function initPalette() {
      const modal = document.getElementById('cmd-palette');
      const inEl = document.getElementById('palette-input');
      const res = document.getElementById('palette-results');
      const show = () => { modal.style.display = 'flex'; inEl.value = ''; inEl.focus(); search(''); };
      const hide = () => modal.style.display = 'none';

      document.getElementById('cmd-k-trigger').onclick = show;
      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); modal.style.display === 'none' ? show() : hide(); }
        if (e.key === 'Escape') hide();
      });
      modal.onclick = (e) => { if (e.target === modal) hide(); };
      inEl.oninput = () => search(inEl.value.toLowerCase().trim());

      function search(q) {
        res.innerHTML = '';
        TOOLS.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)).forEach(t => {
          const item = document.createElement('div');
          item.style.cssText = 'padding:12px 16px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:background 0.2s;';
          item.innerHTML = `<span>${t.name}</span><small style="color:var(--text-muted);">${t.cat}</small>`;
          item.onmouseover = () => item.style.background = 'var(--bg-input)';
          item.onmouseout = () => item.style.background = 'transparent';
          item.onclick = () => { hide(); openTool(t.id); };
          res.appendChild(item);
        });
      }
    }
  </script>
</body>
</html>
