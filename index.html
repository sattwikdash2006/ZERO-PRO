  <!-- ==================== HARDCORE ANTI-INSPECT SHIELD ==================== -->
  <script>
    (function () {
      'use strict';

      // 1. Context Menu (Right Click) Disable
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        return false;
      }, { capture: true });

      // 2. Block Critical Inspection Shortcuts
      window.addEventListener('keydown', function (e) {
        const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
        const ctrlKey = isMac ? e.metaKey : e.ctrlKey;

        // F12
        if (e.keyCode === 123) {
          killEvent(e);
        }
        // Ctrl+Shift+I (Inspect), Ctrl+Shift+J (Console), Ctrl+Shift+C (Element picker)
        if (ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
          killEvent(e);
        }
        // Ctrl+U (View Source)
        if (ctrlKey && (e.keyCode === 85 || e.key === 'u' || e.key === 'U')) {
          killEvent(e);
        }
        // Ctrl+S (Save Page)
        if (ctrlKey && (e.keyCode === 83 || e.key === 's' || e.key === 'S')) {
          killEvent(e);
        }
      }, { capture: true });

      function killEvent(e) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        return false;
      }

      // 3. Infinite Debugger Loop (DevTools Freeze Trap)
      setInterval(function () {
        (function antiDebug(i) {
          try {
            if (('' + i / i).length !== 1 || i === 0) {
              (function () {}.constructor('debugger')());
            } else {
              (function () {}.constructor('debugger')());
            }
          } catch (err) {}
          antiDebug(++i);
        })(0);
      }, 50);

      // 4. DevTools Active Detection via Viewport & Console Timing
      let devtoolsOpen = false;
      const threshold = 160;

      function checkDevTools() {
        const widthDiff = window.outerWidth - window.innerWidth > threshold;
        const heightDiff = window.outerHeight - window.innerHeight > threshold;

        if (widthDiff || heightDiff) {
          if (!devtoolsOpen) {
            devtoolsOpen = true;
            triggerDefense();
          }
        }
      }

      // Detection via Object toString trigger
      const element = new Image();
      Object.defineProperty(element, 'id', {
        get: function () {
          devtoolsOpen = true;
          triggerDefense();
        }
      });

      function triggerDefense() {
        document.body.innerHTML = `
          <div style="background:#030509; color:#ef4444; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:sans-serif; text-align:center; padding:20px;">
            <h1 style="font-size:2rem; margin-bottom:10px;">INSPECTION DETECTED</h1>
            <p style="color:#94a3b8;">Security sandbox locked. Please close Developer Tools and refresh.</p>
          </div>
        `;
      }

      setInterval(() => {
        checkDevTools();
        console.log('%c', element);
        console.clear();
      }, 500);

    })();
  </script>

  <style>
    :root {
      --bg-base: #030509;
      --bg-surface: rgba(11, 15, 26, 0.75);
      --bg-card: rgba(15, 21, 37, 0.6);
      --bg-input: rgba(7, 10, 19, 0.85);

      --border-highlight: rgba(99, 102, 241, 0.5);
      --accent: #6366f1;
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;

      --text-main: #f8fafc;
      --text-secondary: #94a3b8;

      --status-warning: #f59e0b;

      --font-mono: 'JetBrains Mono', monospace;
      --spring: cubic-bezier(0.16, 1, 0.3, 1);

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      background-color: var(--bg-base);
      color: var(--text-main);

      display: flex;
      flex-direction: column;

      position: relative;

      text-shadow: 0 0 15px rgba(99, 102, 241, 0.6);

    #live-canvas {

      animation-duration: 16s;
    }
    @keyframes floatOrb {

      overflow: hidden;

  <div class="cmd-backdrop" id="cmd-palette" style="display:none;">

      <input type="text" class="cmd-search-input" id="palette-input" placeholder="Type a tool name to quick launch..." autocomplete="off">
      <div id="palette-results" style="max-height:360px; overflow-y:auto; padding:0.75rem;"></div>
    </div>
  </div>

  <div id="toast-tray" class="toast-tray"></div>

  <script>
    let deferredPrompt = null;
    const installBtn = document.getElementById('pwa-install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'inline-flex';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      }
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
      ZERO.toast('ZERO PRO successfully installed on your device!', 'success');
    });

    window.addEventListener('online', () => {
      document.getElementById('network-pulse').style.background = '#10b981';
      document.getElementById('network-status').innerText = 'ONLINE / CACHED';
      ZERO.toast('Connected to network', 'info');
    });
    window.addEventListener('offline', () => {
      document.getElementById('network-pulse').style.background = '#f59e0b';
      document.getElementById('network-status').innerText = '100% OFFLINE ACTIVE';
      ZERO.toast('Operating in offline memory sandbox', 'warning');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          console.log('ZERO PWA Service Worker Registered:', reg.scope);
        }).catch((err) => {
          console.log('SW registration fallback active:', err);
        });
      });
    }

    const ZERO = {
      activeToolId: null,

      toast(msg, type = 'info') {
        const tray = document.getElementById('toast-tray');
        const card = document.createElement('div');
        card.className = 'toast-card';
        card.style.borderColor = type === 'error' ? 'var(--status-danger)' : (type === 'success' ? 'var(--status-success)' : (type === 'warning' ? 'var(--status-warning)' : 'var(--border-highlight)'));
        card.textContent = msg;
        tray.appendChild(card);
        setTimeout(() => card.remove(), 3200);
      },

      downloadBlob(data, filename, mimeType) {
        let blob = data instanceof Blob ? data : new Blob([data], { type: mimeType || 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2500);
      },

      setupDropzone(dropEl, inputEl, onFiles) {
        dropEl.onclick = () => inputEl.click();
        dropEl.ondragover = (e) => { e.preventDefault(); dropEl.classList.add('dragover'); };
        dropEl.ondragleave = () => dropEl.classList.remove('dragover');
        dropEl.ondrop = (e) => {
          e.preventDefault();
          dropEl.classList.remove('dragover');
          if (e.dataTransfer.files?.length) onFiles(Array.from(e.dataTransfer.files));
        };
        inputEl.onchange = () => {
          if (inputEl.files?.length) {
            onFiles(Array.from(inputEl.files));
            inputEl.value = '';
          }
        };
      }
    };

    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    (function initBackgroundCanvas() {
      const canvas = document.getElementById('live-canvas');
      const ctx = canvas.getContext('2d');
      let w, h, pts = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 40; i++) {
        pts.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 2 + 1
        });
      }

      function loop() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(99, 102, 241, 0.35)';
        ctx.strokeStyle = 'rgba(99, 102, 241, 0.08)';

        for (let i = 0; i < pts.length; i++) {
          let p = pts[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();

          for (let j = i + 1; j < pts.length; j++) {
            let p2 = pts[j];
            let d = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (d < 140) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    })();

    // 1. PDF Merger
    function renderPdfMerger(mount) {
      mount.innerHTML = `
        <div class="tool-panel">
          <div class="dropzone-laser" id="pdf-merge-drop">
            <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:6px;">Upload PDFs to Merge</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Drop two or more PDF documents to combine into one</p>
            <input type="file" id="pdf-merge-input" multiple accept=".pdf,application/pdf" style="display:none">
          </div>
          <div id="pdf-merge-list" style="margin-bottom:1.5rem; display:flex; flex-direction:column; gap:10px;"></div>
          <button class="action-btn" id="btn-run-merge" disabled>Merge & Export PDF</button>
        </div>
      `;
      let files = [];
      const drop = mount.querySelector('#pdf-merge-drop'), input = mount.querySelector('#pdf-merge-input');
      const list = mount.querySelector('#pdf-merge-list'), btn = mount.querySelector('#btn-run-merge');

      ZERO.setupDropzone(drop, input, (newF) => {
        files.push(...newF.filter(f => f.name.toLowerCase().endsWith('.pdf')));
        render();
      });

      function render() {
        list.innerHTML = files.map((f, i) => `
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-input); padding:12px 18px; border-radius:var(--radius-sm); border:1px solid var(--border-subtle);">
            <span><b>#${i+1}</b> ${f.name} <small style="color:var(--text-muted)">(${(f.size/1024/1024).toFixed(2)} MB)</small></span>
            <button data-idx="${i}" class="del-btn" style="background:none; border:none; color:var(--status-danger); cursor:pointer; font-weight:bold;">✕ Remove</button>
          </div>
        `).join('');
        list.querySelectorAll('.del-btn').forEach(b => {
          b.onclick = () => { files.splice(b.dataset.idx, 1); render(); };
        });
        btn.disabled = files.length < 2;
      }

      btn.onclick = async () => {
        btn.innerText = 'Compiling PDF in memory...';
        btn.disabled = true;
        try {
          const merged = await PDFLib.PDFDocument.create();
          for (const f of files) {
            const doc = await PDFLib.PDFDocument.load(await f.arrayBuffer());
            const pages = await merged.copyPages(doc, doc.getPageIndices());
            pages.forEach(p => merged.addPage(p));
          }
          ZERO.downloadBlob(await merged.save(), 'zero_merged.pdf', 'application/pdf');
          ZERO.toast('PDFs merged successfully!', 'success');
        } catch (e) {
          ZERO.toast(`Merge error: ${e.message}`, 'error');
        } finally {
          btn.innerText = 'Merge & Export PDF';
          btn.disabled = files.length < 2;
        }
      };
    }

    // 2. PDF Splitter
    function renderPdfSplitter(mount) {
      mount.innerHTML = `
        <div class="tool-panel">
          <div class="dropzone-laser" id="split-drop">
            <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:6px;">Upload PDF to Split</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Extract precise page numbers or intervals (e.g. 1-3, 5)</p>
            <input type="file" id="split-input" accept=".pdf,application/pdf" style="display:none">
          </div>
          <div id="split-opts" style="display:none;">
            <p id="split-info" style="font-weight:700; margin-bottom:12px;"></p>
            <input type="text" id="split-range" placeholder="Enter page intervals (e.g. 1-2, 4)" style="margin-bottom:14px;">
            <button class="action-btn" id="split-btn">Extract Pages</button>
          </div>
        </div>
      `;
      let activeDoc = null, file = null;
      const drop = mount.querySelector('#split-drop'), input = mount.querySelector('#split-input');
      const opts = mount.querySelector('#split-opts'), info = mount.querySelector('#split-info');

      ZERO.setupDropzone(drop, input, async (f) => {
        file = f[0];
        activeDoc = await PDFLib.PDFDocument.load(await file.arrayBuffer());
        info.innerText = `${file.name} • Total Pages: ${activeDoc.getPageCount()}`;
        opts.style.display = 'block';
      });

      mount.querySelector('#split-btn').onclick = async () => {
        const str = mount.querySelector('#split-range').value;
        const max = activeDoc.getPageCount();
        const pages = new Set();
        str.split(',').forEach(p => {
          if (p.includes('-')) {
            const [a, b] = p.split('-').map(Number);
            if (a && b) for (let i = Math.max(1, a); i <= Math.min(max, b); i++) pages.add(i);
          } else {
            const n = Number(p);
            if (n >= 1 && n <= max) pages.add(n);
          }
        });
        if (!pages.size) return ZERO.toast('Enter valid page intervals', 'error');

        const newDoc = await PDFLib.PDFDocument.create();
        const copied = await newDoc.copyPages(activeDoc, Array.from(pages).sort((a,b)=>a-b).map(i => i - 1));
        copied.forEach(p => newDoc.addPage(p));
        ZERO.downloadBlob(await newDoc.save(), `split_${file.name}`, 'application/pdf');
        ZERO.toast('Pages extracted successfully!', 'success');
      };
    }

    // 3. PDF Compressor
    function renderPdfCompressor(mount) {
      mount.innerHTML = `
        <div class="tool-panel">
          <div class="dropzone-laser" id="comp-drop">
            <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:6px;">Upload PDF to Compress</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Canvas stream downsampling directly in RAM</p>
            <input type="file" id="comp-input" accept=".pdf,application/pdf" style="display:none">
          </div>
          <div id="comp-opts" style="display:none;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <span>Target JPEG Quantization: <b id="comp-val">65%</b></span>
              <span id="comp-orig" style="color:var(--accent-cyan); font-weight:700;"></span>
            </div>
            <input type="range" id="comp-slider" min="20" max="90" value="65" style="width:100%; margin-bottom:1.5rem;">
            <button class="action-btn" id="comp-btn">Compress Document</button>
          </div>
        </div>
      `;
      let file = null;
      const drop = mount.querySelector('#comp-drop'), input = mount.querySelector('#comp-input');
      const opts = mount.querySelector('#comp-opts'), slider = mount.querySelector('#comp-slider');
      const val = mount.querySelector('#comp-val'), btn = mount.querySelector('#comp-btn');

      ZERO.setupDropzone(drop, input, (f) => {
        file = f[0];
        mount.querySelector('#comp-orig').innerText = `Original: ${(file.size/1024/1024).toFixed(2)} MB`;
        opts.style.display = 'block';
      });

      slider.oninput = () => val.innerText = `${slider.value}%`;

      btn.onclick = async () => {
        btn.innerText = 'Optimizing streams...';
        btn.disabled = true;
        try {
          const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
          const outPdf = await PDFLib.PDFDocument.create();
          const q = slider.value / 100;

          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 1.5 });
            const c = document.createElement('canvas');
            c.width = vp.width; c.height = vp.height;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, c.width, c.height);
            await page.render({ canvasContext: ctx, viewport: vp }).promise;
            const img = await outPdf.embedJpg(c.toDataURL('image/jpeg', q));
            const p = outPdf.addPage([vp.width / 1.5, vp.height / 1.5]);
            p.drawImage(img, { x: 0, y: 0, width: p.getWidth(), height: p.getHeight() });
          }
          const out = await outPdf.save();
          ZERO.downloadBlob(out, `compressed_${file.name}`, 'application/pdf');
          ZERO.toast('PDF compressed successfully!', 'success');
        } catch (e) {
          ZERO.toast(`Compression failed: ${e.message}`, 'error');
        } finally {
          btn.innerText = 'Compress Document';
          btn.disabled = false;
        }
      };
    }

    // 4. PDF Page Organizer
    function renderPdfOrganizer(mount) {
      mount.innerHTML = `
        <div class="tool-panel">
          <div class="dropzone-laser" id="org-drop">
            <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:6px;">Upload PDF to Reorganize</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Reorder, rotate, or delete individual pages visually</p>
            <input type="file" id="org-input" accept=".pdf,application/pdf" style="display:none">
          </div>
          <div id="org-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:14px; margin-bottom:1.5rem;"></div>
          <button class="action-btn" id="org-save" style="display:none;">Save Organized PDF</button>
        </div>
      `;
      let docBytes = null, pages = [];
      const drop = mount.querySelector('#org-drop'), input = mount.querySelector('#org-input');
      const grid = mount.querySelector('#org-grid'), save = mount.querySelector('#org-save');

      ZERO.setupDropzone(drop, input, async (f) => {
        docBytes = await f[0].arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: docBytes }).promise;
        pages = [];
        grid.innerHTML = '<p>Generating page deck...</p>';

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const vp = page.getViewport({ scale: 0.3 });
          const c = document.createElement('canvas');
          c.width = vp.width; c.height = vp.height;
          await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          pages.push({ idx: i - 1, rot: 0, thumb: c.toDataURL() });
        }
        renderDeck();
        save.style.display = 'inline-flex';
      });

      function renderDeck() {
        grid.innerHTML = '';
        pages.forEach((p, idx) => {
          const el = document.createElement('div');
          el.style.cssText = 'background:var(--bg-input); border:1px solid var(--border-subtle); padding:10px; border-radius:var(--radius-sm); text-align:center;';
          el.innerHTML = `
            <img src="${p.thumb}" style="width:100%; border-radius:4px; transform:rotate(${p.rot}deg); transition:transform 0.2s;">
            <div style="font-size:0.8rem; margin:6px 0;">Page ${p.idx + 1}</div>
            <div style="display:flex; justify-content:center; gap:6px;">
              <button class="rot-btn action-btn-secondary" style="padding:2px 8px; font-size:11px;">↻</button>
              <button class="del-btn action-btn-secondary" style="padding:2px 8px; font-size:11px; color:var(--status-danger);">✕</button>
            </div>
          `;
          el.querySelector('.rot-btn').onclick = () => { p.rot = (p.rot + 90) % 360; renderDeck(); };
          el.querySelector('.del-btn').onclick = () => { pages.splice(idx, 1); renderDeck(); };
          grid.appendChild(el);
        });
      }

      save.onclick = async () => {
        const src = await PDFLib.PDFDocument.load(docBytes);
        const dest = await PDFLib.PDFDocument.create();
        for (const item of pages) {
          const [p] = await dest.copyPages(src, [item.idx]);
          if (item.rot) p.setRotation(PDFLib.degrees((p.getRotation().angle || 0) + item.rot));
          dest.addPage(p);
        }
        ZERO.downloadBlob(await dest.save(), 'reordered.pdf', 'application/pdf');
        ZERO.toast('Organized PDF exported successfully!', 'success');
      };
    }

    // 5. PDF to Image Converter
    function renderPdfToImage(mount) {
      mount.innerHTML = `
        <div class="tool-panel">
          <div class="dropzone-laser" id="p2i-drop">
            <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:6px;">Extract Pages as High-Res Images</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Renders pages into crisp 300 DPI PNG raster frames</p>
            <input type="file" id="p2i-input" accept=".pdf,application/pdf" style="display:none">
          </div>
          <button class="action-btn" id="p2i-zip" style="display:none; margin-bottom:1.5rem;">Download All as ZIP</button>
          <div id="p2i-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:16px;"></div>
        </div>
      `;
      const drop = mount.querySelector('#p2i-drop'), input = mount.querySelector('#p2i-input');
      const grid = mount.querySelector('#p2i-grid'), zipBtn = mount.querySelector('#p2i-zip');
      let pageBlobs = [];

      ZERO.setupDropzone(drop, input, async (f) => {
        grid.innerHTML = '<p>Rasterizing pages in memory...</p>';
        pageBlobs = [];
        const pdf = await pdfjsLib.getDocument({ data: await f[0].arrayBuffer() }).promise;
        grid.innerHTML = '';

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const vp = page.getViewport({ scale: 2.0 });
          const c = document.createElement('canvas');
          c.width = vp.width; c.height = vp.height;
          await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
          const url = c.toDataURL('image/png');
          pageBlobs.push({ name: `page-${i}.png`, url });

          const card = document.createElement('div');
          card.style.cssText = 'background:var(--bg-input); border:1px solid var(--border-subtle); padding:10px; border-radius:var(--radius-sm); text-align:center;';
          card.innerHTML = `
            <img src="${url}" style="width:100%; border-radius:4px; margin-bottom:8px;">
            <button class="action-btn-secondary" style="padding:4px 10px; font-size:0.8rem; width:100%;">Save PNG</button>

    // 7. Interactive Foreground Isolator
    function renderBgRemover(mount) {
      mount.innerHTML = `
        <div class="tool-panel">
          <div class="dropzone-laser" id="bg-drop">
            <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:6px;">Upload Image to Isolate Subject</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Auto edge boundary extraction with eyedropper color-keying</p>
            <input type="file" id="bg-input" accept="image/*" style="display:none">
          </div>
          <div id="bg-workbench" style="display:none; text-align:center;">
            <div style="display:flex; justify-content:center; gap:16px; margin-bottom:1.5rem; flex-wrap:wrap;">
              <label>Sensitivity: <input type="range" id="bg-sens" min="5" max="80" value="30" style="vertical-align:middle;"></label>
              <button class="action-btn-secondary" id="bg-re-eval">Re-flood Boundary</button>
            </div>
            <div style="max-height:480px; overflow:auto; border-radius:var(--radius-md); border:1px solid var(--border-subtle); background: repeating-conic-gradient(#1a202c 0% 25%, #0f172a 0% 50%) 50% / 20px 20px; display:inline-block;">
              <canvas id="bg-canvas" style="cursor:crosshair; display:block;"></canvas>
            </div>
            <br><br>
            <button class="action-btn" id="bg-dl">Download Transparent PNG</button>
          </div>
        </div>
      `;
      const drop = mount.querySelector('#bg-drop'), input = mount.querySelector('#bg-input');
      const canvas = mount.querySelector('#bg-canvas'), sens = mount.querySelector('#bg-sens');
      let orig = null;

      ZERO.setupDropzone(drop, input, async (f) => {
        orig = new Image();
        orig.src = URL.createObjectURL(f[0]);
        await orig.decode();
        canvas.width = orig.naturalWidth;
        canvas.height = orig.naturalHeight;
        runMatting();
        mount.querySelector('#bg-workbench').style.display = 'block';
      });

      mount.querySelector('#bg-re-eval').onclick = () => runMatting();
      sens.oninput = () => runMatting();

      function runMatting(sampleCol = null) {
        if (!orig) return;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(orig, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data, w = canvas.width, h = canvas.height;

        let bgR = sampleCol ? sampleCol[0] : (d[0] + d[(w-1)*4] + d[(h-1)*w*4] + d[(h*w-1)*4]) / 4;
        let bgG = sampleCol ? sampleCol[1] : (d[1] + d[(w-1)*4+1] + d[(h-1)*w*4+1] + d[(h*w-1)*4+1]) / 4;
        let bgB = sampleCol ? sampleCol[2] : (d[2] + d[(w-1)*4+2] + d[(h-1)*w*4+2] + d[(h*w-1)*4+2]) / 4;
        const tol = sens.value * 3;

        for (let i = 0; i < d.length; i += 4) {
          const diff = Math.abs(d[i] - bgR) + Math.abs(d[i+1] - bgG) + Math.abs(d[i+2] - bgB);
          if (diff < tol) d[i+3] = 0;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      canvas.onclick = (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = Math.round((e.clientX - rect.left) * (canvas.width / rect.width));
        const y = Math.round((e.clientY - rect.top) * (canvas.height / rect.height));
        const p = canvas.getContext('2d').getImageData(x, y, 1, 1).data;
        runMatting([p[0], p[1], p[2]]);
        ZERO.toast('Keyed background sampled from point!', 'info');
      };

      mount.querySelector('#bg-dl').onclick = () => {
        ZERO.downloadBlob(canvas.toDataURL('image/png'), 'isolated_subject.png', 'image/png');
      };
    }

    // 11. Image Cropper
    function renderImageCropper(mount) {
      mount.innerHTML = `
        <div class="tool-panel">
          <div class="dropzone-laser" id="crp-drop">
            <h3 style="font-size:1.3rem; font-weight:800; margin-bottom:6px;">Upload Image to Crop</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">Click and drag bounded region on viewport</p>
            <input type="file" id="crp-input" accept="image/*" style="display:none">
          </div>
          <div id="crp-box" style="display:none; text-align:center;">
            <canvas id="crp-canvas" style="max-width:100%; border:1px solid var(--border-subtle); cursor:crosshair;"></canvas>
            <br><br>
            <button class="action-btn" id="crp-btn">Export Crop Selection</button>
          </div>
        </div>
      `;
      let img = null, sx = 0, sy = 0, ex = 0, ey = 0, isDown = false;
      const canvas = mount.querySelector('#crp-canvas');

      ZERO.setupDropzone(mount.querySelector('#crp-drop'), mount.querySelector('#crp-input'), async (f) => {
        img = new Image();
        img.src = URL.createObjectURL(f[0]);
        await img.decode();
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        draw();
        mount.querySelector('#crp-box').style.display = 'block';
      });

      function draw() {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        if (isDown || (ex !== sx)) {
          ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 3;
          ctx.strokeRect(sx, sy, ex - sx, ey - sy);
          ctx.fillStyle = 'rgba(99, 102, 241, 0.25)';
          ctx.fillRect(sx, sy, ex - sx, ey - sy);
        }
      }

      canvas.onmousedown = (e) => {
        const r = canvas.getBoundingClientRect();
        sx = (e.clientX - r.left) * (canvas.width / r.width);
        sy = (e.clientY - r.top) * (canvas.height / r.height);
        ex = sx; ey = sy; isDown = true;
      };
      canvas.onmousemove = (e) => {
        if (!isDown) return;
        const r = canvas.getBoundingClientRect();
        ex = (e.clientX - r.left) * (canvas.width / r.width);
        ey = (e.clientY - r.top) * (canvas.height / r.height);
        draw();
      };
      window.addEventListener('mouseup', () => isDown = false);

      mount.querySelector('#crp-btn').onclick = () => {
        const x = Math.min(sx, ex), y = Math.min(sy, ey), w = Math.abs(ex - sx), h = Math.abs(ey - sy);
        if (w < 4 || h < 4) return ZERO.toast('Select a crop region first', 'error');
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h);
        c.toBlob((b) => ZERO.downloadBlob(b, 'cropped.png', 'image/png'));
      };
    }

    // 29. Duplicate File Finder (SHA-256)
    function renderDuplicateFinder(mount) {
      mount.innerHTML = `
        <div class="tool-panel">
          <div class="dropzone-laser" id="df-drop">
            <h3 style="font-size:1.3rem; font-weight:800;">Drop Multiple Files to Check Hashes</h3>

          </div>
          <div id="df-res" style="margin-top:1rem;"></div>
        </div>
      `;
      ZERO.setupDropzone(mount.querySelector('#df-drop'), mount.querySelector('#df-in'), async (files) => {
        const res = mount.querySelector('#df-res');
        res.innerHTML = '<p>Computing SHA-256 digests...</p>';
        const map = new Map();
        for (const f of files) {
          const d = await crypto.subtle.digest('SHA-256', await f.arrayBuffer());
          const h = Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
          if (!map.has(h)) map.set(h, []);
          map.get(h).push(f.name);
        }
        const dups = Array.from(map.entries()).filter(([k, v]) => v.length > 1);
        res.innerHTML = dups.length
          ? dups.map(([h, l]) => `<div style="background:var(--bg-input); padding:8px; border-radius:6px; margin:4px 0;">Duplicate matches: ${l.join(' ⟷ ')}</div>`).join('')
          : '<span style="color:var(--status-success);">All files are completely unique.</span>';
      });
    }

        card.onclick = () => openTool(t.id);
        g.appendChild(card);
      });
    }

    function openTool(id) {
      const tool = TOOLS.find(t => t.id === id);
      if (!tool) return;
      ZERO.activeToolId = tool.id;
      document.getElementById('view-hub').classList.replace('view-active', 'view-hidden');
      document.getElementById('view-tool').classList.replace('view-hidden', 'view-active');
      document.getElementById('tool-active-title').innerText = tool.name;
      document.getElementById('tool-active-cat').innerText = tool.cat;
      const mount = document.getElementById('tool-mount-point');
      mount.innerHTML = '';
      tool.render(mount);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeTool() {
      document.getElementById('view-tool').classList.replace('view-active', 'view-hidden');
      document.getElementById('view-hub').classList.replace('view-hidden', 'view-active');
      ZERO.activeToolId = null;
    }

    function initPalette() {
      const modal = document.getElementById('cmd-palette');
      const inEl = document.getElementById('palette-input');
      const res = document.getElementById('palette-results');
      const show = () => { modal.style.display = 'flex'; inEl.value = ''; inEl.focus(); search(''); };
      const hide = () => modal.style.display = 'none';

      document.getElementById('cmd-k-trigger').onclick = show;
      window.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); modal.style.display === 'none' ? show() : hide(); }
        if (e.key === 'Escape') hide();
      });
      modal.onclick = (e) => { if (e.target === modal) hide(); };
      inEl.oninput = () => search(inEl.value.toLowerCase().trim());

      function search(q) {
        res.innerHTML = '';
        TOOLS.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)).forEach(t => {
          const item = document.createElement('div');
          item.style.cssText = 'padding:12px 16px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:background 0.2s;';
          item.innerHTML = `<span>${t.name}</span><small style="color:var(--text-muted);">${t.cat}</small>`;
          item.onmouseover = () => item.style.background = 'var(--bg-input)';
          item.onmouseout = () => item.style.background = 'transparent';
          item.onclick = () => { hide(); openTool(t.id); };
          res.appendChild(item);
        });
      }
    }
  </script>
</body>
</html>
